<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>mattsapps</title>
  <link rel="icon" href="data:," />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

    :root {
      --bg: #2B2E27;
      --panel: #34372E;
      --panel-border: #454A3D;
      --panel-border-light: #565C4B;
      --chalk: #F2EFE6;
      --chalk-dim: #C9C6BA;
      --mustard: #C9A227;
      --sage: #8B9A7D;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      font-family: 'Inter', sans-serif;
      display: flex;
      justify-content: center;
      padding: 32px 16px;
    }

    main {
      width: 100%;
      max-width: 28rem;
    }

    header {
      margin-bottom: 24px;
    }

    .eyebrow {
      color: var(--mustard);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      margin-bottom: 4px;
    }

    h1 {
      color: var(--chalk);
      font-family: 'Caveat', cursive;
      font-weight: 700;
      font-size: 2.5rem;
      margin: 0;
    }

    .apps {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    a.card {
      display: block;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 0.75rem;
      padding: 16px;
      text-decoration: none;
      transition: border-color 0.15s ease, transform 0.15s ease;
    }

    a.card:hover {
      border-color: var(--panel-border-light);
      transform: translateY(-1px);
    }

    .card-name {
      color: var(--chalk);
      font-family: 'Caveat', cursive;
      font-weight: 700;
      font-size: 1.75rem;
      margin-bottom: 2px;
    }

    .card-tagline {
      color: var(--sage);
      font-size: 0.85rem;
    }

    .empty {
      color: var(--chalk-dim);
      font-size: 0.85rem;
      border: 1px dashed var(--panel-border-light);
      border-radius: 0.75rem;
      padding: 24px;
      text-align: center;
    }

    footer {
      margin-top: 32px;
      padding-top: 16px;
      border-top: 1px dashed var(--panel-border-light);
      color: var(--chalk-dim);
      opacity: 0.6;
      font-size: 0.75rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="eyebrow">APPS</div>
      <h1>mattsapps</h1>
    </header>
    <div class="apps" id="apps"></div>
    <header style="margin-top: 28px; margin-bottom: 12px;">
      <div class="eyebrow">SHOP</div>
    </header>
    <div class="apps">
      <a class="card" href="shop.html">
        <div class="card-name">Shop</div>
        <div class="card-tagline">AI prompt packs &amp; membership</div>
      </a>
    </div>
    <footer>more apps coming soon</footer>
  </main>

  <script>
    // Add a new app here to add it to the launcher.
    const APPS = [
      {
        name: 'Dinner Bell',
        url: 'https://dinner-bell.mattsapps.xyz',
        tagline: 'Weekly dinner picker + grocery list',
      },
      {
        name: 'In Stock',
        url: 'https://in-stock.mattsapps.xyz',
        tagline: 'Sales, inventory, and calendar manager',
      },
      {
        name: 'WarCamera 4k',
        url: 'https://warcamera.mattsapps.xyz',
        tagline: 'Scan a mini, get its datasheet',
      },
    ];

    const container = document.getElementById('apps');
    if (APPS.length === 0) {
      container.innerHTML = '<div class="empty">No apps yet.</div>';
    } else {
      for (const app of APPS) {
        const a = document.createElement('a');
        a.className = 'card';
        a.href = app.url;
        a.innerHTML = `
          <div class="card-name">${app.name}</div>
          <div class="card-tagline">${app.tagline}</div>
        `;
        container.appendChild(a);
      }
    }
  </script>
</body>
</html>
